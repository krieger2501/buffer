name: Release Please

on:
  push:
    branches: [main, alpha]

jobs:
  release-stable:
    name: Release (stable)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3.1.1
        id: app-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v5.0.0
        with:
          release-type: node
          target-branch: main
          token: ${{ steps.app-token.outputs.token }}

  release-alpha:
    name: Release (alpha)
    if: github.ref == 'refs/heads/alpha'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3.1.1
        id: app-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          release-type: node
          target-branch: alpha
          token: ${{ steps.app-token.outputs.token }}
      - name: Auto-merge alpha release PR
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr merge --squash --auto "${{ steps.release.outputs.pr }}"
