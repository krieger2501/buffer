name: CI

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Commit lint
    runs-on: ubuntu-latest
    # Only lint commits on PRs targeting main (release PRs are generated by Release Please)
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .node-version

      - run: corepack enable && corepack install

      - run: pnpm install --frozen-lockfile

      - name: Lint commits
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    env:
      PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .node-version

      - name: Enable Corepack and install pnpm
        run: corepack enable && corepack install

      - name: Cache pnpm store
        uses: actions/cache@v5.0.5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sort package.json
        run: pnpm exec sort-package-json --check

      - name: Type check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Dead code (knip)
        run: pnpm knip

      - name: Build
        run: pnpm build

      - name: Clean working tree
        run: |
          if ! git diff --exit-code; then
            echo "::error::Build produced uncommitted changes. Run 'pnpm build' locally and commit the result."
            exit 1
          fi
